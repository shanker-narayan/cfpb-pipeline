bundle:
  name: cfpb_pipeline

include:
  - resources/*.yml

variables:
  catalog:
    description: UC catalog for this target
    default: cfpb_dev

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-b29e0097-34b1.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-b29e0097-34b1.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: cfpb_prod